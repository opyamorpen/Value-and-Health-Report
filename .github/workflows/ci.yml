name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查关键文档
        run: |
          test -f README.md
          test -f REPOSITORY.md

      - name: 禁止提交凭据文件
        run: |
          if [ -f TEST_ENVIRONMENT.md ]; then
            echo "::error::TEST_ENVIRONMENT.md 包含登录凭据，严禁提交（已列入 .gitignore）"
            exit 1
          fi

      - name: 构建与测试（存在 package.json 时）
        if: hashFiles('package.json') != ''
        run: |
          npm ci
          npm run build --if-present
          npm test --if-present
